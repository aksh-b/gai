[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/aksh-b/gai"

[workspace.dependencies]
gai-core = { path = "crates/gai-core" }
gai-llm = { path = "crates/gai-llm" }
gai = { path = "crates/gai" }
gai-tools = { path = "crates/gai-tools" }
gai-store = { path = "crates/gai-store" }
gai-agent = { path = "crates/gai-agent" }
gai-server = { path = "crates/gai-server" }
gai-memory = { path = "crates/gai-memory" }
gai-skills = { path = "crates/gai-skills" }
gai-orchestra = { path = "crates/gai-orchestra" }
gai-triggers = { path = "crates/gai-triggers" }
gai-sandbox = { path = "crates/gai-sandbox", default-features = false }
gai-browser = { path = "crates/gai-browser", default-features = false }
gai-macros = { path = "crates/gai-macros" }
gai-eval = { path = "crates/gai-eval" }

anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
axum = "0.8"
bollard = "0.21"
chromiumoxide = { version = "0.9", default-features = false }
chrono-tz = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
crossterm = { version = "0.28", features = ["event-stream"] }
croner = "4"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
eventsource-stream = "0.2"
evalexpr = "12"
fastrand = "2"
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
getrandom = "0.3"
governor = "0.10"
hmac = "0.12"
mime_guess = "2"
minijinja = "2"
notify = "8"
pdf-extract = "0.12"
lopdf = { version = "0.42", default-features = false }
ratatui = "0.29"
schemars = { version = "1", features = ["chrono04"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
tempfile = "3"
textwrap = "0.16"
regex = "1"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
# rmcp's HTTP transport is built on reqwest 0.13; gai names its client type.
reqwest013 = { package = "reqwest", version = "0.13", default-features = false }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2"
tar = "0.4"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
ulid = "1"
wiremock = "0.6"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
