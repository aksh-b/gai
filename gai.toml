# gai configuration for this machine. Every option is documented in
# crates/gai/src/config.rs; any value can also come from GAI_* variables.

# Used when an agent names no model. The router sends easy chat to gemma
# and anything needing tools to qwen3 (see [routers.auto]).
default_model = "router/auto"

# Local models from Ollama. scripts/ollama.sh runs Ollama next to gai and
# scripts/serve.sh points the ollama provider at it. Models listed here
# show up in the dashboard; any other pulled model works as ollama/<name>.
# Ollama runs with a 12k-token context (scripts/ollama.sh), so the windows
# here say 12288: gai compacts conversations before Ollama would cut them.
[[providers.ollama.models]]
id = "gemma3:1b"
capabilities = { tools = false, context_window = 12288 }

[[providers.ollama.models]]
id = "qwen3:4b-instruct"
capabilities = { tools = true, context_window = 12288 }

# Thinking-only: correct but slow on this CPU (minutes per step).
[[providers.ollama.models]]
id = "qwen3:4b"
capabilities = { tools = true, reasoning = true, context_window = 12288 }

[[providers.ollama.models]]
id = "nomic-embed-text"
kind = "embedding"
capabilities = { dimensions = 768 }

# Knowledge collections embed with this unless they name another model.
# Collections made earlier keep mock/hash; re-create them to switch.
[knowledge]
embedding_model = "ollama/nomic-embed-text"

# A model router: `router/auto` picks a model per conversation. Easy chat
# goes to gemma; anything needing tools (which gemma lacks) or rated harder
# goes to qwen3. With an API key, add e.g. "anthropic/claude-sonnet-5-5"
# as the hard model.
[routers.auto]
models = [
  { model = "ollama/gemma3:1b", level = "easy" },
  { model = "ollama/qwen3:4b-instruct", level = "hard" },
]

# Models for the image_gen, speak and transcribe tools and /v1/audio,
# /v1/images. scripts/serve.sh uses mock/* models when nothing is set here.
# [media]
# image = "openai/gpt-image-1"
