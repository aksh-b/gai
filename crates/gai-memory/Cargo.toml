[package]
name = "gai-memory"
description = "Memory and knowledge for gai agents: self-edited memory blocks, archival memory, and RAG (loaders, chunking, embeddings, hybrid search)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["pdf"]
# Text extraction from PDF files.
pdf = ["dep:pdf-extract"]

[dependencies]
gai-core.workspace = true
gai-llm.workspace = true
gai-store.workspace = true
gai-tools.workspace = true
async-trait.workspace = true
chrono.workspace = true
pdf-extract = { workspace = true, optional = true }
lopdf.workspace = true
reqwest.workspace = true
base64.workspace = true
regex.workspace = true
url.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
wiremock.workspace = true
gai-store = { workspace = true, features = ["postgres"] }
tempfile.workspace = true
