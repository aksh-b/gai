[package]
name = "gai-macros"
description = "Procedural macros for gai: #[gai::tool] turns an async function into an agent tool."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
