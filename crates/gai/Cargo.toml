[package]
name = "gai"
description = "gai: an agentic AI platform. The SDK facade: config loading and the entry point to every gai subsystem."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["sandbox", "browser", "postgres"]
# The container backend of the code sandbox (Docker/Podman via bollard).
sandbox = ["gai-sandbox/container"]
# The browser tools (headless Chrome via chromiumoxide). They are offered
# only when a Chrome or Chromium is installed.
browser = ["gai-browser/chrome"]
# Postgres as the database (`database = "postgres://…"`).
postgres = ["gai-store/postgres"]

[dependencies]
async-trait.workspace = true
gai-agent.workspace = true
gai-browser.workspace = true
gai-data.workspace = true
gai-eval.workspace = true
gai-macros.workspace = true
gai-core.workspace = true
gai-llm.workspace = true
gai-memory.workspace = true
gai-media.workspace = true
gai-orchestra.workspace = true
gai-triggers.workspace = true
gai-sandbox.workspace = true
gai-skills.workspace = true
gai-store.workspace = true
gai-tools.workspace = true
chrono.workspace = true
dirs.workspace = true
figment.workspace = true
futures.workspace = true
eventsource-stream.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
secrecy.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
zip.workspace = true
regex.workspace = true
tempfile.workspace = true
